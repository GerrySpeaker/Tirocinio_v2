<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labiale Duo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Griglia stile Duolingo migliorata */
        .griglia-livelli {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .livello-box {
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            position: relative;
        }
        .livello-box.locked   { background: #b9b9b9; color: #777; cursor: not-allowed; }
        .livello-box.completato { background: #58cc02; }
        .livello-box.prossimo  { background: #ffb400; transform: scale(1.1); box-shadow: 0 10px 25px rgba(255,180,0,0.4); }
        .livello-box:hover:not(.locked) { transform: translateY(-8px) scale(1.05); }
        .lock-icon { position: absolute; font-size: 50px; opacity: 0.7; }
        
        #esercizio {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }
        video {
            max-width: 100%;
            border-radius: 15px;
            margin: 20px 0;
        }
        .choices-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/static/images/LabDuo_nobg.png" alt="Logo">
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="active">Home</a>
                <a href="/about">Info</a>
                <a href="/contact">Contatti</a>
            </nav>
        </aside>

        <div class="content-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="barra"></div>
            </div>

            <main>
                <div id="schermata-benvenuto" class="home-main">
                    <div id="introduzione">
                        <h1>Impara a leggere le labbra</h1>
                        <p style="margin:30px 0; font-size:18px;">Clicca sul bottone per iniziare il tuo percorso</p>
                    </div>
            
                <div id="schermataIniziale">
                    <button class="start-button" onclick="mostraLivelli()">Inizia la lezione</button>
                </div>

                </div>
                
                <div id="listaLivelli" style="display:none; margin-top:50px;">
                    <h2 style="text-align:center; margin-bottom:40px; font-size:32px;">I tuoi livelli</h2>
                    <div class="griglia-livelli" id="elenco"></div> 
                </div>

                <div id="esercizio" style="display: none"></div>
            </main>
        </div> 
    </div> 

<script>
    async function mostraLivelli() {
        document.getElementById('schermata-benvenuto').style.display = 'none';
        document.getElementById('listaLivelli').style.display = 'block';
        await generaGriglia();
    }

    async function generaGriglia() {
        const elenco = document.getElementById("elenco");
        elenco.innerHTML = "Caricamento in corso...";
        
        try {
            const res = await fetch("/api/livelli?t=" + new Date().getTime());
            let livelli = await res.json();
            
            // ORDINAMENTO FORZATO LATO CLIENT: 1, 2, 3, 4...
            livelli.sort((a, b) => a.numero_livello - b.numero_livello);

            elenco.innerHTML = ""; 
            let TOTALE_LIVELLI = livelli.length;
            let livelliCompletati = 0;

            if (TOTALE_LIVELLI === 0) {
                elenco.innerHTML = "<p style='color: white; font-size: 20px;'>Nessun livello trovato.</p>";
                return;
            }

            livelli.forEach(liv => {
                const box = document.createElement("div");
                box.className = "livello-box";
                box.setAttribute('data-livello-id', liv._id);

                if (liv.sbloccato) {
                    box.classList.add("sbloccato");
                    if (liv.completato) {
                        box.classList.add("completato");
                        livelliCompletati++;
                    } else {
                        box.classList.add("prossimo");
                    }
                    box.innerHTML = liv.numero_livello;
                } else {
                    box.classList.add("locked");
                    box.innerHTML = `${liv.numero_livello}<div class="lock-icon">🔒</div>`;
                }

                elenco.appendChild(box);
            });

            const perc = (livelliCompletati / TOTALE_LIVELLI) * 100;
            document.getElementById("barra").style.width = perc + "%";
            
            attivaClickLivelli();
        } catch (error) {
            console.error("Errore nel caricamento:", error);
            elenco.innerHTML = "<p style='color: red;'>Errore di connessione al database.</p>";
        }
    }

    function attivaClickLivelli() {
    document.querySelectorAll('.livello-box:not(.locked)').forEach(livello => {
        livello.addEventListener('click', () => {
            const livelloId = livello.getAttribute('data-livello-id');
            
            fetch(`/livelli/${livelloId}/gioca`)
                .then(response => response.json())
                .then(data => {
                    console.log("CHIAVI DISPONIBILI:", Object.keys(data));
                    const esercizioEl = document.getElementById("esercizio");
                    const videoUrl = data.video || data.video_url || "";
                    const scelte = data.scelte || data.opzioni || [];
                    const deveEssereBloccato = scelte.length > 0;

                    // --- LOGICA DI SEPARAZIONE ---
                    if (data.contenuto && data.contenuto.tipo === "mimo_labiale") {
    
                    // 2. Recuperiamo la frase (assumendo si chiami 'frase' o simile dentro contenuto)
                    // Se nel DB il campo si chiama 'testo', cambia .frase_da_mimare in .testo
                    const fraseDaMostrare = data.contenuto.testo || "Testo non trovato";

                    esercizioEl.innerHTML = `
                        <div class="esercizio-container">
                            <h2 style="color: #58cc02;">Mima questa parola:</h2>
                            <h1 style="font-size: 48px; margin-bottom: 20px;">"${fraseDaMostrare}"</h1>
                            
                            <div class="webcam-container">
                                <video id="webcam" autoplay muted playsinline></video>
                                <div class="guida-labbra"></div>
                            </div>

                            <div id="risultato-esercizio" style="margin-top:20px; font-weight:bold; font-size:24px; min-height:40px;"></div>
                            
                            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                                <button id="btn-registra" class="btn-nav-avanti" style="background: #ff4b4b; color:white; border:none; border-radius:999px; padding:14px 26px; cursor:pointer;" 
                                        onclick="gestisciRegistrazione('${livelloId}', '${fraseDaMostrare}')">
                                    Registra Mimo
                                </button>
                                <button id="btn-avanti-sempre" class="btn-nav-avanti disabilitato" disabled 
                                        style="background: #58cc02; color:white; border:none; border-radius:999px; padding:14px 26px;"
                                        onclick="completaESblocca('${livelloId}')">
                                    Avanti →
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // Importante: avvia la webcam
                    setTimeout(avviaWebcam, 100);

                    } else {
                        // MODO STANDARD (Capire Labiale)
                        esercizioEl.innerHTML = `
                            <div class="esercizio-container">
                                <h2>${data.titolo}</h2>
                                <p>${data.testo}</p>
                                <video src="${videoUrl}" controls></video>
                                <div class="choices-grid">
                                    ${scelte.map(choice => 
                                        `<button class="start-button" onclick='verificaRisposta("${livelloId}", "${choice}")'>${choice}</button>`
                                    ).join('')}
                                </div>
                                <div id="risultato-esercizio" style="margin-top:20px; font-weight:bold; font-size:24px; min-height:40px;"></div>
                                <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                                    <button onclick="window.location.reload()" 
                                            style="background: #ccc; color: #333; border: none; border-radius: 999px; padding: 14px 26px; font-size: 18px; font-weight: 800; cursor: pointer;">
                                        ← Torna ai livelli
                                    </button>
                                    <button id="btn-avanti-sempre"
                                            class="${deveEssereBloccato ? 'disabilitato': ''}"
                                            ${deveEssereBloccato ? 'disabled': ''} 
                                            style="background: #58cc02; color: white; border: none; border-radius: 999px; padding: 14px 26px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px rgba(88,204,2,0.4);"
                                            onclick="completaESblocca('${livelloId}')">
                                        Avanti →
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    // Questi devono essere fuori dall'if/else perché servono a entrambi
                    document.getElementById('introduzione').style.display = 'none';
                    document.getElementById('listaLivelli').style.display = 'none';
                    esercizioEl.style.display = 'block';
                });
            });
        });
    }

    async function avviaWebcam() {
        const video = document.getElementById('webcam');

        // Verifichiamo che l'elemento esista nel DOM
        if(!video){
            console.error("Elemento webcam non trovato.");
            return;
        }

        try{
            // Richiediamo accesso solo al video
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: 640,
                    height: 480,
                    facingMode: "user",
                    frameRate: {ideal: 25, max: 25}
                },
                audio: false
            });

            video.srcObject = stream;
            console.log("Webcam avviata con successo");
        } catch (err) {
            console.log("Errore nell'accesso alla webcam", err);
            alert("Per favore, consenti l'accesso alla webcam per eseguire l'esercizio");
        }
    }

    let mediaRecorder;
    let recordedChunks = [];
    let countdownInterval = null;

    function gestisciRegistrazione(livelloId, fraseTarget){
        const btn = document.getElementById('btn-registra');
        const statusDiv = document.getElementById('risultato-esercizio');

        if(!mediaRecorder || mediaRecorder.state === "inactive"){
            // -- Inizio registrazione --
            recordedChunks = [];
            const stream = document.getElementById('webcam').srcObject;

            mediaRecorder = new MediaRecorder(stream, {mimeType: 'video/webm'});

            mediaRecorder.ondataavailable = (event) => {
                console.log("Chunk ricevuto, size:", event.data.size);
                if(event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                console.log("Registrazione terminata, invio al server...");
                inviaVideoALipnet(livelloId, fraseTarget);
            };

            mediaRecorder.start();
            btn.disabled = true;
            btn.style.background = "#888";
            btn.innerHTML = "⏳ Registrazione in corso...";

            // Countdown automatico di 4 secondi
            let secondiRimasti = 4;
            statusDiv.style.color = "red";
            statusDiv.innerText = `🔴 Registrazione: ${secondiRimasti} secondi...`;

            countdownInterval = setInterval(() => {
                secondiRimasti--;
                if (secondiRimasti > 0) {
                    statusDiv.innerText = `🔴 Registrazione: ${secondiRimasti} secondi...`;
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    mediaRecorder.stop();
                    btn.disabled = false;
                    btn.innerHTML = "Registra Mimo";
                    btn.style.background = "#ff4b4b";
                    statusDiv.style.color = "#ffb400";
                    statusDiv.innerText = "⏳ Analisi in corso con LipNet...";
                }
            }, 1000);

        }
    }

    async function inviaVideoALipnet(livelloId, fraseTarget) {
        const blob = new Blob(recordedChunks, {type: 'video/webm'});
        const formData = new FormData();
        formData.append('video', blob);
        formData.append('frase_attesa', fraseTarget);

        try{
            const response = await fetch(`/livelli/${livelloId}/analisi-lipnet`, {
                method : "POST",
                body : formData
            });

            const result = await response.json();
            const statusDiv = document.getElementById('risultato-esercizio');
            const btnAvanti = document.getElementById('btn-avanti-sempre');

            if(result.success){
                statusDiv.style.color = "#58cc02";
                statusDiv.innerHTML = `Esatto! Hai detto <strong>"${result.trascrizione}"</strong>🎉`;
                btnAvanti.classList.remove('disabilitato');
                btnAvanti.disabled = false;
            } else {
                statusDiv.style.color = "#ff4b4b";
                statusDiv.innerText = `Ho capito "${result.trascrizione}". Riprova a scandire meglio`;
            }
        } catch (error) {
            console.error("Errore invio del video", error);
            alert("Error durante l'analisi del video.");
        }
    }

    function verificaRisposta(livelloId, sceltaUtente) {
    fetch(`/livelli/${livelloId}/verifica`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scelta: sceltaUtente })
    })
    .then(response => response.json())
    .then(data => {
        const divRisultato = document.getElementById('risultato-esercizio');
        const btnAvanti = document.getElementById('btn-avanti-sempre');

        if (data.corretta) {
            divRisultato.style.color = "#58cc02";
            divRisultato.innerHTML = "Risposta Corretta! 🎉";
            
            // SBLOCCHIAMO IL TASTO AVANTI
            btnAvanti.classList.remove('disabilitato');
            btnAvanti.disabled = false;
            btnAvanti.style.transform = "scale(1.05)"; // Piccolo feedback visivo
        } else {
            divRisultato.style.color = "#ff4b4b";
            divRisultato.innerHTML = "Sbagliato, riprova!";
        }
    });
}

    function completaESblocca(livelloId) {
        fetch('/progressi/completa', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                utente_id: "demo",
                livello_id: livelloId
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                window.location.reload();
            }
        });
    }
</script>
</body>
</html>
